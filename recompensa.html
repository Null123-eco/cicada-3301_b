<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recompensa — Cicada 3301-B</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000000;
      color: #d8dee9;
      font-family: monospace, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .caja {
      max-width: 560px;
      width: 100%;
      border: 1px solid #222730;
      padding: 28px;
      background-color: #0a0c10;
    }
    h1 {
      font-size: 1.3rem;
      margin-bottom: 14px;
      color: #ffffff;
    }
    p {
      line-height: 1.6;
      margin-bottom: 14px;
      color: #b8c0cc;
    }
    .aviso {
      border: 1px dashed #4c566a;
      padding: 14px;
      margin: 18px 0;
      color: #ffffff;
      line-height: 1.5;
    }
    a {
      color: #88c0d0;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="caja">
    <h1>TRANSMISIÓN COMPLETADA</h1>
    <p>Has llegado al final del rastro.</p>
    <div class="aviso">Recoge este papel; una vez en tu casa llama a Null y te dará tu recompensa.</div>
    <a href="index.html">Volver al inicio</a>
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NULO // Cicada 3301-B</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #050608;
      color: #e5e9f0;
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }
    .panel {
      width: 100%;
      max-width: 680px;
      background: #0b0d11;
      border: 1px solid #1d222b;
      padding: 32px 28px;
      text-align: center;
    }
    .etiqueta {
      font-size: 0.75rem;
      letter-spacing: 0.25em;
      color: #7c8798;
      text-transform: uppercase;
      margin-bottom: 18px;
    }
    .cita {
      font-size: 1.35rem;
      line-height: 1.5;
      letter-spacing: 0.08em;
      color: #f0f4f8;
      margin-bottom: 24px;
    }
    .divisor {
      width: 64px;
      height: 1px;
      background: #232934;
      margin: 0 auto 22px;
    }
    .certificado {
      text-align: left;
      background: #07080b;
      border: 1px solid #171b22;
      padding: 20px;
      margin-bottom: 22px;
      font-size: 0.92rem;
      line-height: 1.7;
      color: #c8d0dc;
    }
    .certificado p {
      margin-bottom: 8px;
    }
    .certificado p:last-child {
      margin-bottom: 0;
    }
    .destacado {
      color: #ffffff;
      font-weight: bold;
    }
    .nota-cierre {
      font-size: 0.85rem;
      color: #8b95a5;
      line-height: 1.6;
    }
    .binario-eco {
      position: fixed;
      left: 12px;
      bottom: 10px;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      color: #16191f;
      user-select: all;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <main class="panel">
    <p class="etiqueta">Acceso concedido · Nodo NULO</p>
    <h1 class="cita">LO ÚNICO QUE SÉ ES QUE NO SÉ NADA</h1>
    <div class="divisor"></div>

    <section class="certificado" aria-label="Certificado de descifrado">
      <p><span class="destacado">OPERACIÓN:</span> Cicada 3301-B</p>
      <p><span class="destacado">ESTADO:</span> Secuencia completada</p>
      <p><span class="destacado">RANGO OTORGADO:</span> Descifrador de NULO</p>
      <p><span class="destacado">FIRMA:</span> Null</p>
    </section>

    <p class="nota-cierre">
      Toma captura de esta pantalla como comprobante de que llegaste hasta el final.
    </p>
  </main>

  <span class="binario-eco">01100101 01100011 01101111</span>

</body>
</html>
